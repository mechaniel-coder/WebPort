name: Deploy to GitHub Pages

# Publishes the portfolio to GitHub Pages on every push to the default branch.
#
# The committed dist/ is built for a domain root, but a GitHub Pages *project*
# site is served from a sub-path (https://<user>.github.io/WebPort/). Rather than
# publishing the committed output, this rebuilds with BASE_PATH set, so every
# internal link resolves correctly under the sub-path.
#
# There is nothing to install: the generator has no dependencies.

# Fires on a push to whichever branch GitHub considers the default, rather than
# to a hardcoded `main`. This repository's default is currently the branch the
# work was delivered on, and naming `main` here meant the workflow could never
# run. The guard on the build job below is what enforces it, so this keeps
# working if the default is later renamed or the work is merged elsewhere.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the default branch publishes; pushes to other branches start a run
    # that skips immediately rather than deploying a feature branch to production.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Runs first: it reports the base path and origin Pages will actually serve
      # from, which the build needs in order to write correct links.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Build for the Pages sub-path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: node build.js

      - name: Verify the build before publishing
        run: node verify.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
