<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-labelledby="card-title">
  <title id="card-title">Aurelia — a coastal retreat on the northern Sonoma coast</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3d2"/>
      <stop offset="1" stop-color="#efc9ad"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8996b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e8996b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#181512" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#181512" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#181512" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="880" cy="215" r="230" fill="url(#glow)"/>
  <circle cx="880" cy="215" r="68" fill="#e8996b"/>

  <!-- Layered headlands, matching the site's generated artwork -->
  <path d="M0 330 C 180 296 340 356 520 342 C 700 328 880 288 1200 322 L1200 630 L0 630Z"
        fill="#c9a184"/>
  <path d="M0 396 C 200 366 380 418 560 404 C 760 388 980 356 1200 392 L1200 630 L0 630Z"
        fill="#a87f66"/>
  <path d="M0 462 C 220 436 400 480 600 468 C 820 454 1020 428 1200 458 L1200 630 L0 630Z"
        fill="#7e5f4e"/>
  <path d="M0 528 C 240 508 420 542 640 532 C 860 522 1040 500 1200 524 L1200 630 L0 630Z"
        fill="#57443a"/>
  <path d="M0 588 C 260 574 460 600 700 592 C 920 584 1060 570 1200 586 L1200 630 L0 630Z"
        fill="#332924"/>

  <rect width="1200" height="630" fill="url(#shade)"/>

  <!-- Arch mark, the building's signature window -->
  <g transform="translate(92 108)">
    <path d="M0 74 A 37 37 0 0 1 74 74 L74 118" fill="none" stroke="#e2c3a8" stroke-width="6"/>
    <path d="M0 74 L0 118" fill="none" stroke="#e2c3a8" stroke-width="6"/>
    <path d="M37 37 L37 118" stroke="#e2c3a8" stroke-width="6" opacity="0.45"/>
  </g>

  <text x="92" y="392" fill="#f7f2e9"
        font-family="Georgia, 'Times New Roman', serif" font-size="104" letter-spacing="10">
    AURELIA
  </text>
  <text x="96" y="452" fill="#e7dccc"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="31">
    A twenty-two room retreat on the northern Sonoma coast
  </text>
  <text x="96" y="536" fill="#c9b7a2"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="23" letter-spacing="4">
    SEA RANCH, CALIFORNIA
  </text>
</svg>
