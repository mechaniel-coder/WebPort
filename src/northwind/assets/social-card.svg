<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-labelledby="card-title">
  <title id="card-title">Northwind — observability for systems that are not allowed to go down</title>

  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8ff7" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#199e70" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0b0e14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3987e5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0e14"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Hairline grid, matching the dashboard's chart chrome -->
  <g stroke="#1b2331" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <!-- Three series, drawn to the same 2px spec the real charts use -->
  <path d="M0 500 C 120 470 200 505 300 468 C 400 432 470 470 560 440
           C 660 408 740 452 840 418 C 940 386 1060 420 1200 392 L1200 630 L0 630Z"
        fill="url(#fade)"/>
  <path d="M0 500 C 120 470 200 505 300 468 C 400 432 470 470 560 440
           C 660 408 740 452 840 418 C 940 386 1060 420 1200 392"
        fill="none" stroke="#3987e5" stroke-width="3" stroke-linecap="round"
        stroke-linejoin="round"/>
  <path d="M0 552 C 130 540 220 560 320 534 C 430 506 510 540 610 516
           C 720 490 800 520 900 500 C 1000 480 1100 502 1200 486"
        fill="none" stroke="#199e70" stroke-width="3" stroke-linecap="round"
        stroke-linejoin="round"/>
  <path d="M0 452 C 110 424 190 448 290 404 C 380 364 430 300 520 344
           C 610 388 690 400 790 366 C 900 328 1030 366 1200 330"
        fill="none" stroke="#d95926" stroke-width="3" stroke-linecap="round"
        stroke-linejoin="round"/>
  <circle cx="1200" cy="330" r="7" fill="#d95926" stroke="#0b0e14" stroke-width="3"/>

  <!-- Wordmark -->
  <g transform="translate(80 92)">
    <path d="M0 44V4l19 19L38 4v40" fill="none" stroke="#4f8ff7" stroke-width="5"
          stroke-linecap="square"/>
  </g>
  <text x="136" y="132" fill="#f2f5fa"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="44" font-weight="650" letter-spacing="-1">
    Northwind
  </text>

  <text x="80" y="252" fill="#f2f5fa"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="60" font-weight="650" letter-spacing="-2.2">
    Observability for systems
  </text>
  <text x="80" y="322" fill="#f2f5fa"
        font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="60" font-weight="650" letter-spacing="-2.2">
    that cannot go down.
  </text>

  <text x="80" y="382" fill="#a9b6cc"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="24" letter-spacing="1">
    Metrics · Traces · Logs — priced on ingest, not per seat
  </text>
</svg>
